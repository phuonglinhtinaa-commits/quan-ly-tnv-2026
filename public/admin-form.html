<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập nhật Vi phạm / Thành tích / Ghi chú (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .suggestion-box {
      position: absolute;
      z-index: 1000;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 0 0 5px 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .suggestion-item {
      padding: 8px 12px;
      cursor: pointer;
    }
    .suggestion-item:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 600px;">
    <a href="index.html" class="btn btn-sm btn-secondary mb-4">&larr; Quay lại Trang chủ</a>
    
    <div class="card shadow-sm">
      <div class="card-header bg-warning text-dark"><h5 class="mb-0">Form 3: Kỷ luật / Ghi chú / Thành tích (Admin)</h5></div>
      <div class="card-body">
        <form id="adminForm">
          <div class="mb-3">
            <label class="form-label fw-bold text-danger">Mật khẩu Quản trị viên</label>
            <input type="password" class="form-control" id="adminPassword" required placeholder="Nhập mật khẩu Admin">
          </div>
          <hr>
          
          <!-- Họ tên có tự động gợi ý -->
          <div class="mb-3 position-relative">
            <label class="form-label">Họ và tên TNV (Gõ để tìm kiếm tên gợi ý)</label>
            <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Minh" autocomplete="off">
            <div id="suggestionBox" class="suggestion-box d-none"></div>
          </div>

          <div class="mb-3" id="mssvContainer">
            <label class="form-label" id="mssvLabel">Mã số sinh viên (MSSV)</label>
            <input type="text" class="form-control" id="mssv" placeholder="Nhập MSSV (chỉ bắt buộc nếu trùng tên)">
            <small class="text-muted" id="mssvNote">Chỉ bắt buộc nhập MSSV nếu có 2 sinh viên trở lên trùng tên.</small>
          </div>

          <div class="mb-3">
            <label class="form-label">Chọn mục cập nhật</label>
            <select class="form-select" id="updateType" required>
              <option value="fault">Thêm Vi phạm / Kỷ luật</option>
              <option value="note">Thêm Ghi chú mới (Dạng Bullet Point)</option>
              <option value="achievement">Cập nhật Thành tích Chiến dịch</option>
            </select>
          </div>
          
          <div id="dynamicFields" class="mb-3"></div>
          <button type="submit" class="btn btn-warning w-100 fw-bold">Xác nhận Cập nhật</button>
        </form>
        <div id="formAlert" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script>
    const updateTypeSelect = document.getElementById('updateType');
    const dynamicFields = document.getElementById('dynamicFields');
    const fullNameInput = document.getElementById('fullName');
    const suggestionBox = document.getElementById('suggestionBox');
    const mssvInput = document.getElementById('mssv');

    // Đề xuất gợi ý tên khi gõ
    fullNameInput.addEventListener('input', async (e) => {
      const val = e.target.value.trim();
      if (val.length === 0) {
        suggestionBox.classList.add('d-none');
        return;
      }
      try {
        const res = await fetch(`/api/volunteers/search-names?term=${encodeURIComponent(val)}`);
        const result = await res.json();
        if (result.success && result.data.length > 0) {
          suggestionBox.innerHTML = result.data.map(v => `
            <div class="suggestion-item" onclick="selectSuggestion('${v.fullName}', '${v.mssv}')">
              <strong>${v.fullName}</strong> <small class="text-muted">(${v.mssv})</small>
            </div>
          `).join('');
          suggestionBox.classList.remove('d-none');
        } else {
          suggestionBox.classList.add('d-none');
        }
      } catch (err) {
        console.error(err);
      }
    });

    function selectSuggestion(name, mssv) {
      fullNameInput.value = name;
      mssvInput.value = mssv;
      suggestionBox.classList.add('d-none');
    }

    document.addEventListener('click', (e) => {
      if (!fullNameInput.contains(e.target) && !suggestionBox.contains(e.target)) {
        suggestionBox.classList.add('d-none');
      }
    });

    function renderDynamicFields() {
      const type = updateTypeSelect.value;
      if (type === 'fault') {
        dynamicFields.innerHTML = `
          <div class="mb-3"><label class="form-label">Lỗi vi phạm</label><input type="text" class="form-control" id="faultName" required placeholder="Ví dụ: Đi muộn họp"></div>
          <div class="mb-3"><label class="form-label">Ngày vi phạm</label><input type="date" class="form-control" id="faultDate" required></div>
        `;
        document.getElementById('faultDate').valueAsDate = new Date();
      } else if (type === 'note') {
        dynamicFields.innerHTML = `<div class="mb-3"><label class="form-label">Nội dung Ghi chú mới</label><textarea class="form-control" id="generalNote" rows="3" required placeholder="Nhập ghi chú mới (ví dụ: Tham gia Ban Truyền thông)..."></textarea></div>`;
      } else if (type === 'achievement') {
        dynamicFields.innerHTML = `
          <div class="mb-3"><label class="form-label">Tên Chiến dịch</label><input type="text" class="form-control" id="campaignName" required></div>
          <div class="mb-3"><label class="form-label">Thành tích nổi bật</label><input type="text" class="form-control" id="campaignAchievement" required></div>
        `;
      }
    }

    updateTypeSelect.addEventListener('change', renderDynamicFields);
    renderDynamicFields();

    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = updateTypeSelect.value;
      let valueData = {};
      if (type === 'fault') {
        valueData = { fault: document.getElementById('faultName').value, date: document.getElementById('faultDate').value };
      } else if (type === 'note') {
        valueData = { generalNote: document.getElementById('generalNote').value };
      } else if (type === 'achievement') {
        valueData = { campaignName: document.getElementById('campaignName').value, achievement: document.getElementById('campaignAchievement').value };
      }

      const alertDiv = document.getElementById('formAlert');
      alertDiv.className = 'alert alert-info';
      alertDiv.textContent = 'Đang xử lý...';

      const res = await fetch('/api/volunteers/admin-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adminPassword: document.getElementById('adminPassword').value,
          mssv: mssvInput.value,
          fullName: fullNameInput.value,
          updateType: type,
          valueData
        })
      });
      const data = await res.json();
      
      if (data.requireMssv) {
        alertDiv.className = 'alert alert-warning';
        alertDiv.textContent = data.message;
        mssvInput.focus();
        mssvInput.classList.add('is-invalid');
      } else {
        mssvInput.classList.remove('is-invalid');
        alertDiv.className = `alert alert-${data.success ? 'success' : 'danger'}`;
        alertDiv.textContent = data.message;
      }
    });
  </script>
</body>
</html>
