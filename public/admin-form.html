<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập nhật Vi phạm / Thành tích (Admin)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 600px;">
    <a href="index.html" class="btn btn-sm btn-secondary mb-4">&larr; Quay lại Trang chủ</a>
    
    <div class="card shadow-sm">
      <div class="card-header bg-warning text-dark"><h5 class="mb-0">Form 3: Kỷ luật / Ghi chú / Thành tích (Admin)</h5></div>
      <div class="card-body">
        <form id="adminForm">
          <div class="mb-3">
            <label class="form-label fw-bold text-danger">Mật khẩu Quản trị viên</label>
            <input type="password" class="form-control" id="adminPassword" required placeholder="Nhập mật khẩu Admin">
          </div>
          <hr>
          <div class="mb-3"><label class="form-label">Mã số sinh viên (MSSV)</label><input type="text" class="form-control" id="mssv" required placeholder="B22DCCN123"></div>
          <div class="mb-3"><label class="form-label">Họ và tên (Tùy chọn)</label><input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A"></div>
          <div class="mb-3">
            <label class="form-label">Chọn mục cập nhật</label>
            <select class="form-select" id="updateType" required>
              <option value="fault">Thêm Vi phạm / Kỷ luật</option>
              <option value="note">Cập nhật Ghi chú chung</option>
              <option value="achievement">Cập nhật Thành tích Chiến dịch</option>
            </select>
          </div>
          <div id="dynamicFields" class="mb-3"></div>
          <button type="submit" class="btn btn-warning w-100 fw-bold">Xác nhận Cập nhật</button>
        </form>
        <div id="formAlert" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script>
    const updateTypeSelect = document.getElementById('updateType');
    const dynamicFields = document.getElementById('dynamicFields');

    function renderDynamicFields() {
      const type = updateTypeSelect.value;
      if (type === 'fault') {
        dynamicFields.innerHTML = `
          <div class="mb-3"><label class="form-label">Lỗi vi phạm</label><input type="text" class="form-control" id="faultName" required placeholder="Ví dụ: Đi muộn họp"></div>
          <div class="mb-3"><label class="form-label">Ngày vi phạm</label><input type="date" class="form-control" id="faultDate" required></div>
        `;
        document.getElementById('faultDate').valueAsDate = new Date();
      } else if (type === 'note') {
        dynamicFields.innerHTML = `<div class="mb-3"><label class="form-label">Ghi chú chung</label><textarea class="form-control" id="generalNote" rows="3" required></textarea></div>`;
      } else if (type === 'achievement') {
        dynamicFields.innerHTML = `
          <div class="mb-3"><label class="form-label">Tên Chiến dịch</label><input type="text" class="form-control" id="campaignName" required></div>
          <div class="mb-3"><label class="form-label">Thành tích nổi bật</label><input type="text" class="form-control" id="campaignAchievement" required></div>
        `;
      }
    }

    updateTypeSelect.addEventListener('change', renderDynamicFields);
    renderDynamicFields();

    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = updateTypeSelect.value;
      let valueData = {};
      if (type === 'fault') {
        valueData = { fault: document.getElementById('faultName').value, date: document.getElementById('faultDate').value };
      } else if (type === 'note') {
        valueData = { generalNote: document.getElementById('generalNote').value };
      } else if (type === 'achievement') {
        valueData = { campaignName: document.getElementById('campaignName').value, achievement: document.getElementById('campaignAchievement').value };
      }

      const res = await fetch('/api/volunteers/admin-update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          adminPassword: document.getElementById('adminPassword').value,
          mssv: document.getElementById('mssv').value,
          fullName: document.getElementById('fullName').value,
          updateType: type,
          valueData
        })
      });
      const data = await res.json();
      const alertDiv = document.getElementById('formAlert');
      alertDiv.className = `alert alert-${data.success ? 'success' : 'danger'}`;
      alertDiv.textContent = data.message;
    });
  </script>
</body>
</html>
