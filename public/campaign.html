<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký Chiến dịch lớn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 500px;">
    <a href="index.html" class="btn btn-sm btn-secondary mb-4">&larr; Quay lại Trang chủ</a>
    <div class="card shadow-sm">
      <div class="card-header bg-info text-white"><h5 class="mb-0">Form 4: Đăng ký Chiến dịch lớn</h5></div>
      <div class="card-body">
        <form id="campaignForm">
          <div class="mb-3"><label class="form-label">Họ và tên</label><input type="text" class="form-control" id="fullName" required placeholder="Nguyễn Văn A"></div>
          <div class="mb-3"><label class="form-label">Mã số sinh viên (MSSV)</label><input type="text" class="form-control" id="mssv" required placeholder="B22DCCN123"></div>
          <div class="mb-3"><label class="form-label">Tên Chiến dịch lớn</label><input type="text" class="form-control" id="campaignName" required placeholder="Tiếp sức mùa thi 2026"></div>
          <button type="submit" class="btn btn-info text-white w-100">Đăng ký Chiến dịch</button>
        </form>
        <div id="alertBox" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('campaignForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/volunteers/campaign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName: document.getElementById('fullName').value,
          mssv: document.getElementById('mssv').value,
          campaignName: document.getElementById('campaignName').value
        })
      });
      const data = await res.json();
      const alertDiv = document.getElementById('alertBox');
      alertDiv.className = `alert alert-${data.success ? 'success' : 'danger'}`;
      alertDiv.textContent = data.message;
    });
  </script>
</body>
</html>
