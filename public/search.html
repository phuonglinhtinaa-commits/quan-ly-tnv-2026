<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra cứu Thành tích Tình nguyện Viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 700px;">
    <a href="index.html" class="btn btn-sm btn-secondary mb-4">&larr; Quay lại Trang chủ</a>
    
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-secondary text-white"><h5 class="mb-0">Form 5: Tra cứu Thành tích Cá nhân (Công khai)</h5></div>
      <div class="card-body">
        <form id="searchForm" class="row g-3">
          <div class="col-md-5"><input type="text" class="form-control" id="fullName" placeholder="Họ và tên" required></div>
          <div class="col-md-4"><input type="text" class="form-control" id="mssv" placeholder="MSSV" required></div>
          <div class="col-md-3"><button type="submit" class="btn btn-secondary w-100">Tra cứu</button></div>
        </form>
      </div>
    </div>

    <div id="resultContainer"></div>
  </div>

  <script>
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/volunteers/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName: document.getElementById('fullName').value,
          mssv: document.getElementById('mssv').value
        })
      });
      const result = await res.json();
      const container = document.getElementById('resultContainer');
      
      if (!result.success) {
        container.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
        return;
      }

      const v = result.data;
      container.innerHTML = `
        <div class="card shadow-sm border-primary">
          <div class="card-body">
            <h4 class="text-primary">${v.fullName} <small class="text-muted">(${v.mssv})</small></h4>
            <p><strong>Trạng thái:</strong> <span class="badge bg-success">Đã phê duyệt</span></p>
            <p><strong>Ghi chú chung:</strong> ${v.generalNote || 'Không có'}</p>
            <hr>
            <h5>🎯 Hoạt động Tình nguyện:</h5>
            <ul>${v.activities.length ? v.activities.map(a => `<li>${a.content} (${a.date})</li>`).join('') : '<li>Chưa có hoạt động</li>'}</ul>
            <h5>⚠️ Vi phạm / Kỷ luật:</h5>
            <ul>${v.faults.length ? v.faults.map(f => `<li><span class="text-danger">${f.fault}</span> (${f.date})</li>`).join('') : '<li>Chưa có vi phạm</li>'}</ul>
            <h5>🚩 Chiến dịch lớn tham gia:</h5>
            <ul>${v.campaigns.length ? v.campaigns.map(c => `<li><strong>${c.campaignName}</strong>:${c.achievement || 'Chưa ghi nhận thành tích'}</li>`).join('') : '<li>Chưa tham gia chiến dịch lớn</li>'}</ul>
          </div>
        </div>
      `;
    });
  </script>
</body>
</html>
